name: Release check

# Release PRs only: when a pull request changes the version in pyproject.toml,
# check that uv.lock is up to date and constraints.txt matches its export, so a
# mismatch is fixed on the PR instead of after the tag exists. The publish
# workflows run the same checks again at release time.
on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/scripts/release_guard.sh"
      - ".github/workflows/release-check.yml"

permissions:
  contents: read

jobs:
  constraints:
    name: uv.lock and constraints.txt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR merge commit plus its first parent, the base branch, whose
          # pyproject.toml version the script compares against.
          fetch-depth: 2
          persist-credentials: false
      # Full tag required — setup-uv dropped major/minor tags in v8.0.0, so
      # `@v9` does not resolve. See the note in lint.yml.
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Check uv.lock and constraints.txt (release PRs only)
        run: bash .github/scripts/release_guard.sh pr
